kind = "mobile"
previewPath = "/"
title = "DocPocket"
version = "1.0.0"
id = "artifacts/docpocket"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20240

[services.development]
run = "pnpm --filter @workspace/docpocket run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/docpocket", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/docpocket", "run", "serve" ]

[services.env]
PORT = "20240"
BASE_PATH = "/"
